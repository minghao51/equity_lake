site_name: Equity Lake
site_description: Local-first equity EOD data pipeline
site_url: https://minghao.github.io/equity_lake
repo_name: equity_lake
repo_url: https://github.com/minghao/equity_lake
exclude_docs: 'README.md|catalog/.*|archive/.*'

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
  - User Guide:
      - CLI Reference: user-guide/20260406-cli-reference.md
      - Ingestion: user-guide/ingestion.md
      - Pipeline: user-guide/pipeline.md
      - Features and Enrichments: user-guide/20260829-features-and-enrichments.md
      - Monitoring and Alerting: user-guide/20260829-monitoring-and-alerting.md
      - Data Quality Validation: user-guide/20260829-data-quality-validation.md
      - Delta Lake Maintenance: user-guide/20260829-delta-maintenance.md
      - Backtesting: user-guide/backtesting.md
      - Arena and Findings: user-guide/20260829-arena-and-findings.md
      - Signals: user-guide/signals.md
      - ML Rigor: user-guide/20260810-ml-rigor.md
      - REST API: user-guide/20260811-read-api.md
      - RAG Corpus Seeding: user-guide/20260813-rag-corpus-seeding.md
      - Dashboard Hosting: user-guide/20260406-dashboard-hosting.md
  - Developer:
      - Architecture: developer/architecture/ARCHITECTURE.md
      - Data Flow: developer/architecture/data-flow.md
      - Pipeline Contracts: developer/architecture/pipeline-contracts.md
      - Integrations: developer/architecture/INTEGRATIONS.md
      - Stack: developer/architecture/STACK.md
      - Testing: developer/architecture/TESTING.md
      - Conventions: developer/architecture/CONVENTIONS.md
      - Auto-Backfill and Gap Detection: developer/architecture/auto-backfill-and-gap-detection.md
      - Catalog Subsystem: developer/architecture/catalog-subsystem.md
      - ML Analytics Platform: developer/architecture/ml-analytics-platform.md
      - Project Structure: developer-guide/project-structure.md
      - Developer Tools: developer-guide/devtools.md
      - Decision Records:
          - 'ADR-0001: Medallion layout and generated catalog': decisions/0001-medallion-layout-and-generated-catalog.md
          - 'ADR-0002: Top-level modules and import boundaries': decisions/0002-top-level-modules-import-boundaries.md
          - 'ADR-0003: Polars-first dataframe engine': decisions/0003-polars-first-dataframe-engine.md
          - 'ADR-0004: Single Settings env contract': decisions/0004-single-settings-env-contract.md
          - 'ADR-0005: Native Typer CLI contract': decisions/0005-native-typer-cli-contract.md
          - 'ADR-0006: Auxiliary data paths': decisions/0006-auxiliary-data-paths.md
          - 'ADR-0007: pointblank at ingestion boundaries': decisions/0007-pointblank-at-ingestion-boundaries.md
          - 'ADR-0008: VectorBacktestEngine default': decisions/0008-vector-backtest-engine-default.md
          - 'ADR-0009: Decisions and archive directories': decisions/0009-decisions-and-archive-directories.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

extra:
  version:
    provider: mike
