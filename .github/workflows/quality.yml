name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python "${{ matrix.python-version }}" --group dev

      - name: Ruff
        run: uv run --python "${{ matrix.python-version }}" ruff check .

      - name: Ruff format
        run: uv run --python "${{ matrix.python-version }}" ruff format --check .

      - name: Mypy
        run: uv run --python "${{ matrix.python-version }}" mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python "${{ matrix.python-version }}" --group dev --group backtesting

      # Prove the interpreter that is about to run the suite really has the data files
      # and extension submodules the tests load lazily (vader's lexicon, certifi's CA
      # bundle, pandas' parquet engine). This step passing while individual tests still
      # report missing files means the environment was changed *during* the session, not
      # installed wrong — which is how RS-Q00's mid-suite `.venv` rebuild was found. It
      # also turns a damaged install into one named failure instead of ~30 confusing ones.
      - name: Verify installed dependencies
        run: |
          uv run --python "${{ matrix.python-version }}" python - <<'PY'
          import tempfile
          from pathlib import Path

          import certifi, httpx, pandas, pandas.core.arrays.arrow.extension_types, polars, pyarrow, pyarrow.parquet
          import vaderSentiment.vaderSentiment as vader_module
          from vaderSentiment.vaderSentiment import SentimentIntensityAnalyzer

          # 1. SentimentIntensityAnalyzer opens vader_lexicon.txt from the installed
          #    package on construction; a missing data file raises FileNotFoundError.
          lexicon = Path(vader_module.__file__).with_name("vader_lexicon.txt")
          assert lexicon.is_file() and lexicon.stat().st_size > 0, lexicon
          SentimentIntensityAnalyzer()

          # 2. httpx builds its TLS context from certifi.where(); a missing cacert.pem
          #    fails inside httpx._config.create_ssl_context for every LLM call.
          cacert = Path(certifi.where())
          assert cacert.is_file() and cacert.stat().st_size > 0, cacert
          httpx.Client().close()

          # 3. pandas' parquet engine imports this exact pyarrow submodule, and a real
          #    write/read proves the engine, not just the Arrow layer, loads.
          frame = pandas.DataFrame({"a": [1]})
          assert pyarrow.Table.from_pandas(frame).to_pandas()["a"].tolist() == [1]
          assert polars.DataFrame({"a": [1]}).to_pandas()["a"].tolist() == [1]
          with tempfile.TemporaryDirectory() as tmp:
              parquet_path = Path(tmp) / "smoke.parquet"
              frame.to_parquet(parquet_path, engine="pyarrow")
              assert pandas.read_parquet(parquet_path)["a"].tolist() == [1]
          print("dependency smoke check ok")
          PY

      - name: Pytest
        run: uv run --python "${{ matrix.python-version }}" pytest -q -m "not network and not integration"

      - name: Security audit (advisory policy)
        continue-on-error: true
        run: uv run --python "${{ matrix.python-version }}" pip-audit --skip-editable

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --group dev --group docs

      - name: Markdown lint
        run: uv run pymarkdown --disable-rules MD013,MD033,MD041 scan docs/developer/architecture/data-flow.md docs/developer/architecture/pipeline-contracts.md docs/user-guide/ingestion.md

      # Repository-wide recursive markdown gate, owned by the `make lint-md` target (the
      # baseline ratchet behind it is RS-Q00's). The changed-file step above stays
      # mandatory; this one adds the tree-wide check instead of replacing it.
      - name: Recursive Markdown ratchet
        run: make lint-md

      - name: MkDocs build
        run: uv run mkdocs build

      - name: Internal link validation
        run: uv run mkdocs build --site-dir /tmp/equity-lake-site

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify CLI command tree
        run: |
          uv run equity --help
          uv run equity dashboard build --help
          uv run equity dashboard serve --help
          uv run equity monitor --help
          uv run equity pipeline --help
          uv run equity catalog-generate --help
