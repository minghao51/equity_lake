<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1150" width="1800" height="1150" role="img">
  <title>Dashboard information architecture — one registry, two renderers</title>
  <desc>Naming standardised 2026-11-07. The shared registry in dashboard/pages.py owns page keys, labels, output files and renderer flags. Overview, Datasets, Health and Updates share identical labels in Streamlit and static export. Datasets and Updates are standardised. Config remains deliberately static-only; Private Tracking Preview remains deliberately Streamlit-only and loopback-gated under ADR-0018. Tests enforce registry parity, complete and unique self-marking navigation, and shared component notice states. The naming decision is closed; the page-set asymmetry remains recorded in the registry.</desc>
  <defs>
    <style type="text/css">
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 14.5px; fill: #5b6b82; }
      .section { font-size: 15.5px; font-weight: 600; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
      .annotation { font-size: 11.5px; }
      .muted { fill: #5b6b82; }
      .strong { font-weight: 600; }
      .accent { fill: #1f6feb; }
      .green { fill: #1a7f37; }
      .amber { fill: #9a6700; }
      .red { fill: #b42318; }
      .gated { fill: #6b7280; }
      .rule { stroke: #c9d4e3; stroke-width: 1.5; }
      .footer { font-size: 11px; fill: #5b6b82; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1150" rx="10" fill="#ffffff"/>
  <g id="heading">
    <text x="40" y="65" class="title">Dashboard information architecture — one registry, two renderers</text>
    <text x="40" y="95" class="subtitle">Naming standardised 2026-11-07: page keys, labels and output files live once, in <tspan class="mono">dashboard/pages.py</tspan>. Both renderers consume it.</text>
  </g>

  <g id="navigation-conventions">
    <text x="40" y="133" class="strong accent">6 registry pages · 5 app entries · 5 export entries · 4 shared logical pages</text>
    <text x="790" y="133" class="annotation green">Shared labels standardised · 1 deliberate exclusive page per renderer</text>
    <g class="code-chip">
      <rect x="40" y="151" width="1720" height="34" rx="10" fill="#f2f5fa" stroke="#c9d4e3" stroke-width="1.5"/>
      <text x="64" y="173" class="mono">PAGE_SPECS = (overview, datasets, health, updates, config, private_tracking)</text>
    </g>
    <g class="code-chip">
      <rect x="40" y="195" width="1720" height="34" rx="10" fill="#f2f5fa" stroke="#c9d4e3" stroke-width="1.5"/>
      <text x="64" y="217" class="mono">NAV_LINKS = ("Overview","index.html"), ("Datasets","datasets.html"), ("Health","health.html"), ("Updates","updates.html"), ("Config","config.html")</text>
    </g>
    <g class="code-chip">
      <rect x="40" y="239" width="1720" height="34" rx="10" fill="#f2f5fa" stroke="#c9d4e3" stroke-width="1.5"/>
      <text x="64" y="261" class="mono">PAGE_LABELS = ("Overview", "Datasets", "Health", "Updates", "Private Tracking Preview")</text>
    </g>
  </g>

  <g id="parity-matrix">
    <rect x="40" y="294" width="1720" height="420" rx="10" fill="#f7f9fc" stroke="#c9d4e3" stroke-width="1.5"/>
    <rect x="42" y="296" width="1716" height="56" rx="10" fill="#eef3fa"/>
    <g id="matrix-header">
      <text x="64" y="329" class="section">Logical page</text>
      <text x="244" y="329" class="section">Key</text>
      <text x="454" y="320" class="section">Streamlit app</text>
      <text x="454" y="341" class="mono muted">dashboard/streamlit_app.py</text>
      <text x="834" y="320" class="section">Static export</text>
      <text x="834" y="341" class="mono muted">dashboard/exporter.py</text>
      <text x="1214" y="329" class="section">Status</text>
    </g>

    <rect x="42" y="416" width="1716" height="56" rx="10" fill="#eef3fa"/>
    <rect x="42" y="536" width="1716" height="56" rx="10" fill="#eef3fa"/>
    <rect x="42" y="596" width="1716" height="56" rx="10" fill="#eef3fa"/>
    <rect x="42" y="656" width="1716" height="56" rx="10" fill="#eef3fa"/>
    <path d="M 40,354 H 1760 M 40,414 H 1760 M 40,474 H 1760 M 40,534 H 1760 M 40,594 H 1760 M 40,654 H 1760" class="rule" fill="none"/>
    <path d="M 220,294 V 714 M 430,294 V 714 M 810,294 V 714 M 1190,294 V 714" class="rule" fill="none"/>
    <path d="M 44,426 V 462 M 44,546 V 582" stroke="#1f6feb" stroke-width="1.5" fill="none"/>
    <path d="M 44,606 V 642" stroke="#9a6700" stroke-width="1.5" fill="none"/>
    <path d="M 44,666 V 702" stroke="#6b7280" stroke-width="1.5" fill="none"/>

    <g class="matrix-row" id="row-overview">
      <text x="64" y="391" class="strong">Overview</text>
      <text x="244" y="391" class="mono">overview</text>
      <text x="454" y="391">"Overview"</text>
      <text x="834" y="379">"Overview"</text>
      <text x="834" y="400" class="mono muted">index.html</text>
      <g class="status-chip">
        <rect x="1214" y="369" width="98" height="30" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="1263" y="388" class="annotation strong green" text-anchor="middle">in parity</text>
      </g>
    </g>
    <g class="matrix-row" id="row-datasets">
      <text x="64" y="451" class="strong">Datasets</text>
      <text x="244" y="451" class="mono">datasets</text>
      <text x="454" y="451" class="strong accent">"Datasets"</text>
      <text x="834" y="439" class="strong accent">"Datasets"</text>
      <text x="834" y="460" class="mono muted">datasets.html</text>
      <g class="status-chip">
        <rect x="1214" y="429" width="166" height="30" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/>
        <text x="1297" y="448" class="annotation strong accent" text-anchor="middle">STANDARDISED</text>
      </g>
      <text x="1398" y="451" class="annotation muted">was "Dataset Explorer" / "Datasets"</text>
    </g>
    <g class="matrix-row" id="row-health">
      <text x="64" y="511" class="strong">Health</text>
      <text x="244" y="511" class="mono">health</text>
      <text x="454" y="511">"Health"</text>
      <text x="834" y="499">"Health"</text>
      <text x="834" y="520" class="mono muted">health.html</text>
      <g class="status-chip">
        <rect x="1214" y="489" width="98" height="30" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="1263" y="508" class="annotation strong green" text-anchor="middle">in parity</text>
      </g>
    </g>
    <g class="matrix-row" id="row-updates">
      <text x="64" y="571" class="strong">Updates</text>
      <text x="244" y="571" class="mono">updates</text>
      <text x="454" y="571" class="strong accent">"Updates"</text>
      <text x="834" y="559" class="strong accent">"Updates"</text>
      <text x="834" y="580" class="mono muted">updates.html</text>
      <g class="status-chip">
        <rect x="1214" y="549" width="166" height="30" rx="10" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/>
        <text x="1297" y="568" class="annotation strong accent" text-anchor="middle">STANDARDISED</text>
      </g>
      <text x="1398" y="571" class="annotation muted">was "Update History" / "Updates"</text>
    </g>
    <g class="matrix-row" id="row-config">
      <text x="64" y="631" class="strong">Config</text>
      <text x="244" y="631" class="mono">config</text>
      <text x="454" y="631" class="muted">(absent)</text>
      <text x="834" y="619">"Config"</text>
      <text x="834" y="640" class="mono muted">config.html</text>
      <g class="status-chip">
        <rect x="1214" y="609" width="128" height="30" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
        <text x="1278" y="628" class="annotation strong amber" text-anchor="middle">STATIC ONLY</text>
      </g>
      <text x="1360" y="631" class="annotation muted">(deliberate)</text>
    </g>
    <g class="matrix-row" id="row-private-tracking">
      <text x="64" y="691" class="strong">Private tracking</text>
      <text x="244" y="691" class="mono">private_tracking</text>
      <text x="454" y="691" class="strong gated">"Private Tracking Preview"</text>
      <text x="834" y="691" class="muted">(absent)</text>
      <g class="status-chip">
        <rect x="1214" y="669" width="290" height="30" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
        <text x="1359" y="688" class="annotation strong gated" text-anchor="middle">STREAMLIT ONLY · GATED</text>
      </g>
      <text x="1520" y="691" class="annotation gated">loopback-gated · deliberate</text>
    </g>
  </g>
  <text x="834" y="731" class="annotation muted">Identical shared labels; deliberately different page sets.</text>

  <g id="what-changed">
    <rect x="40" y="748" width="1060" height="154" rx="10" fill="#f7f9fc" stroke="#c9d4e3" stroke-width="1.5"/>
    <text x="64" y="777" class="section">What changed (2026-11-07)</text>
    <text x="64" y="803" class="green">•</text>
    <text x="84" y="803">One registry (<tspan class="mono">dashboard/pages.py</tspan>) now owns each page's key, label, output file and renderer flags.</text>
    <text x="64" y="836" class="green">•</text>
    <text x="84" y="836">Both renderers read it: the app's <tspan class="mono">selectbox("Page", PAGE_LABELS)</tspan> and the export's <tspan class="mono">NAV_LINKS</tspan>;</text>
    <text x="84" y="856">neither hardcodes a label.</text>
    <text x="64" y="883" class="green">•</text>
    <text x="84" y="883">The retired spellings "Dataset Explorer" and "Update History" are gone from both renderers.</text>
  </g>
  <g id="enforcement">
    <rect x="1124" y="748" width="636" height="258" rx="10" fill="#eef3fa" stroke="#c9d4e3" stroke-width="1.5"/>
    <text x="1148" y="777" class="section">Enforced, not just documented</text>
    <text x="1148" y="808" class="mono">tests/unit/test_dashboard_ia_parity.py</text>
    <text x="1148" y="833">fails if a renderer hardcodes a label, a retired label returns,</text>
    <text x="1148" y="855">a registry page loses its renderer, or the navigation stops</text>
    <text x="1148" y="877">being complete/unique/self-marking.</text>
    <path d="M 1148,902 H 1736" class="rule" fill="none"/>
    <text x="1148" y="931" class="mono">tests/unit/test_dashboard_components.py</text>
    <text x="1148" y="958">keeps each notice state mapped to a Streamlit primitive</text>
    <text x="1148" y="980">and a stylesheet rule.</text>
  </g>
  <g id="deliberate-asymmetry">
    <rect x="40" y="914" width="1060" height="92" rx="10" fill="#f7f9fc" stroke="#c9d4e3" stroke-width="1.5"/>
    <text x="64" y="943" class="section">Deliberately NOT unified</text>
    <text x="64" y="967">The page-SET asymmetry survives: Config is static-only; the private tracking preview is app-only because it is</text>
    <text x="64" y="987">loopback-gated (ADR-0018). Naming was standardised; page sets were not.</text>
  </g>

  <g id="decision-status">
    <rect x="40" y="1020" width="1720" height="70" rx="10" fill="#f7f9fc" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="64" y="1061" class="section green">Status</text>
    <text x="174" y="1061"><tspan class="strong green">Naming decision: CLOSED (standardised).</tspan> Page-set asymmetry: recorded in the registry. Shared component vocabulary: implemented in <tspan class="mono">dashboard/components.py</tspan>.</text>
  </g>
  <g id="artifact-footer">
    <text x="40" y="1127" class="footer">2026-11-07 · equity_lake · sources: dashboard/pages.py, dashboard/exporter.py, dashboard/streamlit_app.py · design artifact, not a contract</text>
  </g>
</svg>
