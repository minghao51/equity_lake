<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1250" width="1800" height="1250" role="img">
  <title>Dashboard component &amp; state sheet — one vocabulary, implemented</title>
  <desc>The shipped shared vocabulary lives in dashboard/components.py and the single page registry in dashboard/pages.py. Eight component rows and eight exact Notice mappings connect Streamlit and static HTML. Six state cards distinguish current call sites from states without shipped call sites. Enforcement tests protect the mappings and semantic rules.</desc>
  <style type="text/css">
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #0f172a; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14.5px; fill: #5b6b82; }
    .section { font-size: 15.5px; font-weight: 600; }
    .body { font-size: 12.5px; }
    .shared { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .annotation { font-size: 11px; fill: #5b6b82; }
    .footer { font-size: 11px; fill: #5b6b82; }
    .muted { fill: #5b6b82; }
    .accent { fill: #1f6feb; }
    .ok { fill: #1a7f37; }
    .warn { fill: #9a6700; }
    .danger { fill: #b42318; }
    .gated { fill: #6b7280; }
    .panel { fill: #f7f9fc; stroke: #c9d4e3; stroke-width: 1.5; }
    .line { stroke: #c9d4e3; stroke-width: 1.5; fill: none; }
    .chip { fill: #ffffff; stroke-width: 1.5; }
  </style>
  <rect width="1800" height="1250" fill="#ffffff"/>

  <g id="page-heading">
    <text class="title" x="40" y="48">Dashboard component &amp; state sheet — one vocabulary, implemented</text>
    <text class="subtitle" x="40" y="77"><tspan class="mono">dashboard/components.py</tspan> owns the meaning of each state; each renderer owns its presentation. Mappings below are the shipped mappings.</text>
  </g>

  <g id="where-it-lives" aria-label="Where it lives: shared registry and notice semantics">
    <rect class="panel" x="40" y="96" width="1720" height="78" rx="10"/>
    <text class="section" x="64" y="117">Where it lives</text>
    <text x="64" y="139"><tspan class="mono accent">dashboard/pages.py</tspan> — the single page registry: key, label, output file, renderer flags (<tspan class="mono">PAGE_SPECS</tspan>, <tspan class="mono">PAGE_LABELS</tspan>, <tspan class="mono">NAV_LINKS</tspan>).</text>
    <text x="64" y="159"><tspan class="mono accent">dashboard/components.py</tspan> — <tspan class="mono">Notice</tspan> (closed set of 8 states) + <tspan class="mono">streamlit_method()</tspan>, <tspan class="mono">css_modifier()</tspan>, <tspan class="mono">notice_class()</tspan>, <tspan class="mono">render_notice()</tspan>.</text>
  </g>

  <g id="component-vocabulary" aria-label="Component vocabulary: shared name, Streamlit, static HTML and access path">
    <text class="section" x="40" y="200">Component vocabulary</text>
    <text class="annotation" x="1760" y="200" text-anchor="end">01 / SHIPPED PRIMITIVES · 8 SHARED NAMES</text>
    <rect x="40" y="216" width="1720" height="256" rx="10" fill="#ffffff"/>
    <rect x="40" y="216" width="1720" height="32" rx="10" fill="#eef3fa"/>
    <rect x="40" y="248" width="280" height="224" rx="10" fill="#eef3fa"/>
    <text class="body shared accent" x="64" y="237">Shared name</text>
    <text class="body shared muted" x="344" y="237">Streamlit (as used)</text>
    <text class="body shared muted" x="824" y="237">Static CSS/HTML (as used)</text>
    <text class="body shared muted" x="1504" y="237">Reached through</text>
    <path class="line" d="M320 216V472 M800 216V472 M1480 216V472 M40 248H1760 M40 276H1760 M40 304H1760 M40 332H1760 M40 360H1760 M40 388H1760 M40 416H1760 M40 444H1760"/>
    <g id="component-page-shell">
      <text class="shared" x="64" y="267">Page shell / hero</text>
      <text class="mono" x="344" y="267">st.title, st.caption</text>
      <text class="mono" x="824" y="267">.hero, .eyebrow, .muted</text>
      <text x="1504" y="267">page registry label</text>
    </g>
    <g id="component-section-heading">
      <text class="shared" x="64" y="295">Section heading</text>
      <text class="mono" x="344" y="295">st.subheader, st.divider</text>
      <text class="mono" x="824" y="295">&lt;h2&gt;, section blocks</text>
      <text x="1504" y="295">renderer-local</text>
    </g>
    <g id="component-kpi">
      <text class="shared" x="64" y="323">KPI / metric</text>
      <text class="mono" x="344" y="323">st.columns + text</text>
      <text class="mono" x="824" y="323">.grid, .metric</text>
      <text x="1504" y="323">renderer-local</text>
    </g>
    <g id="component-data-table">
      <text class="shared" x="64" y="351">Data table</text>
      <text class="mono" x="344" y="351">st.dataframe</text>
      <text class="mono" x="824" y="351">&lt;table&gt; in .card</text>
      <text x="1504" y="351">renderer-local</text>
    </g>
    <g id="component-raw-payload">
      <text class="shared" x="64" y="379">Raw payload view</text>
      <text class="mono" x="344" y="379">st.json</text>
      <text class="mono" x="824" y="379">&lt;pre&gt; block</text>
      <text x="1504" y="379">renderer-local</text>
    </g>
    <g id="component-navigation">
      <text class="shared" x="64" y="407">Navigation</text>
      <text class="mono" x="344" y="407">sidebar selectbox("Page", PAGE_LABELS)</text>
      <text class="mono" x="824" y="407">.nav, .nav-link, .nav-link.active (from NAV_LINKS)</text>
      <text x="1504" y="407">page registry</text>
    </g>
    <g id="component-notice">
      <text class="shared" x="64" y="435">Notice (all states)</text>
      <text class="mono" x="344" y="435">render_notice(st, Notice.X, text)</text>
      <text class="mono" x="824" y="435">&lt;li class="alert alert--&lt;modifier&gt;"&gt;</text>
      <text class="mono" x="1504" y="435">components.py</text>
    </g>
    <g id="component-page-config">
      <text class="shared" x="64" y="463">Page config / chrome</text>
      <text class="mono" x="344" y="463">st.set_page_config</text>
      <text class="mono" x="824" y="463">document head + .nav bar</text>
      <text x="1504" y="463">renderer-local</text>
    </g>
    <rect class="line" x="40" y="216" width="1720" height="256" rx="10"/>
  </g>

  <g id="shipped-mappings" aria-label="Exact shipped Notice mappings">
    <text class="section" x="40" y="497">The shipped mapping table</text>
    <text class="annotation" x="1760" y="497" text-anchor="end">02 / CLOSED SET · 8 NOTICE STATES</text>
    <rect x="40" y="512" width="1720" height="174" rx="10" fill="#ffffff"/>
    <rect x="40" y="512" width="1720" height="22" rx="10" fill="#eef3fa"/>
    <text class="mono shared" x="64" y="528">Notice</text>
    <text class="mono shared" x="644" y="528">Streamlit primitive</text>
    <text class="mono shared" x="1224" y="528">CSS modifier</text>
    <path class="line" d="M620 512V686 M1200 512V686 M40 534H1760 M40 553H1760 M40 572H1760 M40 591H1760 M40 610H1760 M40 629H1760 M40 648H1760 M40 667H1760"/>
    <g id="mapping-info">
      <text class="mono" x="64" y="548">INFO</text><text class="mono" x="644" y="548">info</text><text class="mono accent" x="1224" y="548">info</text>
    </g>
    <g id="mapping-success">
      <text class="mono" x="64" y="567">SUCCESS</text><text class="mono" x="644" y="567">success</text><text class="mono ok" x="1224" y="567">ok</text>
    </g>
    <g id="mapping-warning">
      <text class="mono" x="64" y="586">WARNING</text><text class="mono" x="644" y="586">warning</text><text class="mono warn" x="1224" y="586">warn</text>
    </g>
    <g id="mapping-error">
      <text class="mono" x="64" y="605">ERROR</text><text class="mono" x="644" y="605">error</text><text class="mono danger" x="1224" y="605">error</text>
    </g>
    <g id="mapping-unavailable">
      <text class="mono" x="64" y="624">UNAVAILABLE</text><text class="mono" x="644" y="624">warning</text><text class="mono warn" x="1224" y="624">unavailable</text>
    </g>
    <g id="mapping-partial">
      <text class="mono" x="64" y="643">PARTIAL</text><text class="mono" x="644" y="643">warning</text><text class="mono warn" x="1224" y="643">partial</text>
    </g>
    <g id="mapping-refused">
      <text class="mono" x="64" y="662">REFUSED</text><text class="mono" x="644" y="662">error</text><text class="mono danger" x="1224" y="662">error</text>
    </g>
    <g id="mapping-gated">
      <text class="mono" x="64" y="681">GATED</text><text class="mono" x="644" y="681">info</text><text class="mono gated" x="1224" y="681">gated</text>
    </g>
    <rect class="line" x="40" y="512" width="1720" height="174" rx="10"/>
    <text class="annotation" x="40" y="704"><tspan class="mono">unavailable</tspan>/<tspan class="mono">partial</tspan> are amber warnings, not errors: the book is healthy, the evidence is not complete. <tspan class="mono">gated</tspan> is neutral: not built is not a failure.</text>
    <text class="annotation" x="40" y="721"><tspan class="mono">refused</tspan> stays loud — it is a fail-closed security/validation outcome.</text>
  </g>

  <g id="state-matrix" aria-label="Six display states: rules and current call sites">
    <text class="section" x="40" y="747">State matrix</text>
    <text class="annotation" x="1760" y="747" text-anchor="end">03 / DISPLAY RULES · SHIPPED CALL SITES EXPLICIT</text>
    <g id="state-loading" aria-label="Loading: placeholder only, never a real-looking zero">
      <rect class="panel" x="40" y="762" width="560" height="166" rx="10"/>
      <rect class="chip" x="64" y="778" width="120" height="28" rx="10" stroke="#1f6feb"/>
      <text class="section accent" x="80" y="798">Loading</text>
      <text class="annotation" x="576" y="798" text-anchor="end">01 / READING</text>
      <text x="64" y="824">Data is still being read.</text>
      <text class="annotation" x="64" y="843">Today: no shipped call site yet (renderer skeletons).</text>
      <text x="64" y="875"><tspan class="shared accent">LOOK</tspan><tspan>  Skeleton / placeholder only.</tspan></text>
      <text x="64" y="912"><tspan class="shared">NEVER</tspan><tspan>  A zero that looks like a real value.</tspan></text>
    </g>
    <g id="state-empty" aria-label="Empty: source exists but has no rows; explicitly say no data yet">
      <rect class="panel" x="620" y="762" width="560" height="166" rx="10"/>
      <rect class="chip" x="644" y="778" width="120" height="28" rx="10" stroke="#1f6feb"/>
      <text class="section accent" x="660" y="798">Empty</text>
      <text class="annotation" x="1156" y="798" text-anchor="end">02 / NO ROWS</text>
      <text x="644" y="824">The source exists and genuinely has no rows.</text>
      <text class="annotation" x="644" y="842">Today: app “No datasets available…” (Notice.INFO).</text>
      <text class="annotation" x="644" y="857">Export: empty alert list (Notice.SUCCESS),</text>
      <text class="annotation" x="644" y="872">“No health alerts were exported.”</text>
      <text x="644" y="892"><tspan class="shared accent">LOOK</tspan><tspan>  Show “no data yet” explicitly.</tspan></text>
      <text x="644" y="912"><tspan class="shared">NEVER</tspan><tspan>  Conflate no rows with unavailable evidence.</tspan></text>
    </g>
    <g id="state-unavailable" aria-label="Unavailable: amber reason and scope, never zero or an ambiguous blank">
      <rect class="panel" x="1200" y="762" width="560" height="166" rx="10"/>
      <rect class="chip" x="1224" y="778" width="150" height="28" rx="10" stroke="#9a6700"/>
      <text class="section warn" x="1240" y="798">Unavailable</text>
      <text class="annotation" x="1736" y="798" text-anchor="end">03 / NO EVIDENCE</text>
      <text x="1224" y="824">Required evidence is missing or quarantined.</text>
      <text class="annotation" x="1224" y="843">Today: app “No health report available…” (Notice.UNAVAILABLE).</text>
      <text x="1224" y="875"><tspan class="shared warn">LOOK</tspan><tspan>  Amber; show the reason and the scope.</tspan></text>
      <text x="1224" y="912"><tspan class="shared warn">NEVER</tspan><tspan>  Render 0, or a blank cell that reads as zero.</tspan></text>
    </g>
    <g id="state-partial" aria-label="Partial: identify valid and withheld components; a subtotal is never a total">
      <rect class="panel" x="40" y="940" width="560" height="166" rx="10"/>
      <rect class="chip" x="64" y="956" width="120" height="28" rx="10" stroke="#9a6700"/>
      <text class="section warn" x="80" y="976">Partial</text>
      <text class="annotation" x="576" y="976" text-anchor="end">04 / INCOMPLETE</text>
      <text x="64" y="1002">Some components are complete; some are withheld.</text>
      <text class="annotation" x="64" y="1020">Today: no shipped call site yet;</text>
      <text class="annotation" x="64" y="1035">P02 CLI reports are the reference behaviour.</text>
      <text x="64" y="1056"><tspan class="shared warn">LOOK</tspan><tspan>  Amber; show valid components.</tspan></text>
      <text x="64" y="1073">Name exactly what is withheld.</text>
      <text x="64" y="1093"><tspan class="shared warn">NEVER</tspan><tspan>  Present a subtotal as a total.</tspan></text>
    </g>
    <g id="state-refused" aria-label="Refused: red, value-free reason and next action; nothing was written">
      <rect class="panel" x="620" y="940" width="560" height="166" rx="10"/>
      <rect class="chip" x="644" y="956" width="120" height="28" rx="10" stroke="#b42318"/>
      <text class="section danger" x="660" y="976">Refused</text>
      <text class="annotation" x="1156" y="976" text-anchor="end">05 / REJECTED</text>
      <text x="644" y="1002">Input rejected: invalid file, conflict or invariant violated.</text>
      <text class="annotation" x="644" y="1020">Today: app non-loopback private-tracking gate</text>
      <text class="annotation" x="644" y="1035">(Notice.REFUSED → st.error); statement/mark rejection</text>
      <text class="annotation" x="644" y="1050">paths in the CLI.</text>
      <text x="644" y="1073"><tspan class="shared danger">LOOK</tspan><tspan>  Red; value-free reason plus the next action.</tspan></text>
      <text x="644" y="1093"><tspan class="shared danger">ALWAYS</tspan><tspan>  Nothing was written; never imply a commit.</tspan></text>
    </g>
    <g id="state-gated" aria-label="Gated: planned but not built, grey, never interactive; private-data exposure is refused">
      <rect class="panel" x="1200" y="940" width="560" height="166" rx="10"/>
      <rect class="chip" x="1224" y="956" width="120" height="28" rx="10" stroke="#6b7280"/>
      <text class="section gated" x="1240" y="976">Gated</text>
      <text class="annotation" x="1736" y="976" text-anchor="end">06 / PLAN ONLY</text>
      <text x="1224" y="1002">The surface is planned but is not authorized.</text>
      <text class="annotation" x="1224" y="1020">Today: console/P03 surfaces (not built). App gating messages</text>
      <text class="annotation" x="1224" y="1035">use REFUSED, not GATED, when private data would</text>
      <text class="annotation" x="1224" y="1050">otherwise be exposed.</text>
      <text x="1224" y="1073"><tspan class="shared gated">LOOK</tspan><tspan>  Grey; labelled </tspan><tspan class="mono gated">GATED — NOT AUTHORIZED</tspan><tspan>.</tspan></text>
      <text x="1224" y="1093"><tspan class="shared gated">NEVER</tspan><tspan>  Look interactive; gated means not built.</tspan></text>
    </g>
  </g>

  <g id="enforcement" aria-label="Enforcement tests and rules that must survive">
    <text class="section" x="40" y="1133">Enforcement</text>
    <text class="annotation" x="1760" y="1133" text-anchor="end">04 / TESTED SEMANTICS · REGISTRY PARITY</text>
    <rect x="40" y="1144" width="1720" height="70" rx="10" fill="#f2f5fa" stroke="#c9d4e3" stroke-width="1.5"/>
    <text class="mono" x="64" y="1159">tests/unit/test_dashboard_components.py — every state maps to a real Streamlit primitive and to a stylesheet rule;</text>
    <text class="mono" x="64" y="1175">unavailable/partial never render as success; refused stays error; gated stays info.</text>
    <text class="mono" x="64" y="1191">tests/unit/test_dashboard_ia_parity.py — labels come from the registry; retired spellings cannot return.</text>
    <text class="mono" x="64" y="1207">Rules that must survive: unavailable ≠ 0 · unknown ≠ real · mixed is an aggregate, never a row kind · partial subtotal is never a total · refused means nothing was written · gated means not built</text>
  </g>
  <text class="footer" x="40" y="1233">2026-11-07 · equity_lake · sources: dashboard/components.py, dashboard/pages.py, dashboard/exporter.py, dashboard/streamlit_app.py · design artifact, not a contract</text>
</svg>
